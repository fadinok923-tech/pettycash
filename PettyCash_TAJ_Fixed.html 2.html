<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #0F6E56;
    --green-light: #E1F5EE;
    --green-mid: #5DCAA5;
    --red: #993C1D;
    --red-light: #FAECE7;
    --red-mid: #F0997B;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --blue: #185FA5;
    --blue-light: #E6F1FB;
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F1EDE6;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.06);
    --text: #1A1A18;
    --text2: #6B6860;
    --text3: #A09D97;
    --accent: #0F6E56;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ── APP SHELL ── */
  #app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ── HEADER ── */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border2);
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .app-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .header-date {
    font-size: 11px;
    color: var(--text3);
    font-weight: 400;
    letter-spacing: 0.03em;
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: var(--surface);
    border-top: 1px solid var(--border2);
    display: flex;
    z-index: 200;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 0 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text3);
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.03em;
    transition: color 0.15s;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-icon {
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-icon svg { width: 20px; height: 20px; stroke-width: 1.8; fill: none; stroke: currentColor; }

  /* ── PAGES ── */
  .page { display: none; flex: 1; overflow-y: auto; padding: 16px 16px 90px; }
  .page.active { display: block; }

  /* ── BALANCE HERO ── */
  .balance-hero {
    background: var(--text);
    border-radius: var(--radius);
    padding: 22px 20px 18px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .balance-hero::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .balance-hero .label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .balance-hero .amount {
    font-family: 'DM Serif Display', serif;
    font-size: 38px;
    color: #fff;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 18px;
  }
  .balance-hero .amount.negative { color: #F0997B; }
  .hero-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .hero-stat { background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; }
  .hero-stat .s-label { font-size: 10px; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
  .hero-stat .s-val { font-size: 17px; font-weight: 600; color: #fff; }
  .hero-stat .s-val.green { color: var(--green-mid); }
  .hero-stat .s-val.red { color: var(--red-mid); }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 18px 0 10px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .section-link {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    font-weight: 500;
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
  }

  /* ── FILTER PILLS ── */
  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .pill {
    padding: 5px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .pill.active { background: var(--text); color: #fff; border-color: var(--text); font-weight: 500; }

  /* ── ENTRY CARDS ── */
  .entry-list { display: flex; flex-direction: column; gap: 8px; }
  .entry-card {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border2);
  }
  .entry-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .entry-icon.income { background: var(--green-light); }
  .entry-icon.expense { background: var(--red-light); }
  .entry-body { flex: 1; min-width: 0; }
  .entry-desc { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .entry-right { text-align: right; flex-shrink: 0; }
  .entry-amount { font-size: 15px; font-weight: 600; }
  .entry-amount.income { color: var(--green); }
  .entry-amount.expense { color: var(--red); }
  .del-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text3); font-size: 13px; margin-top: 3px;
    padding: 0; display: block; width: 100%; text-align: right;
  }
  .del-btn:hover { color: var(--red); }
  .empty-state {
    text-align: center; padding: 40px 20px;
    color: var(--text3); font-size: 14px; line-height: 1.6;
  }
  .empty-state .e-icon { font-size: 36px; margin-bottom: 10px; }

  /* ── ADD PAGE ── */
  .type-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .type-btn {
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    text-align: center;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .type-btn .t-icon { font-size: 22px; display: block; margin-bottom: 4px; }
  .type-btn .t-label { font-size: 13px; font-weight: 500; color: var(--text2); }
  .type-btn.active.income { background: var(--green-light); border-color: var(--green-mid); }
  .type-btn.active.income .t-label { color: var(--green); }
  .type-btn.active.expense { background: var(--red-light); border-color: var(--red-mid); }
  .type-btn.active.expense .t-label { color: var(--red); }

  .form-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border2);
  }
  .form-group { margin-bottom: 16px; }
  .form-group label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; display: block; margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--accent);
    background: var(--surface);
  }
  .amount-wrap { position: relative; }
  .amount-wrap .currency {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 15px; color: var(--text2); font-weight: 500; pointer-events: none;
  }
  .amount-wrap input { padding-left: 44px; }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .cat-chip {
    padding: 8px 6px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg);
    text-align: center;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.12s;
  }
  .cat-chip .c-icon { font-size: 18px; display: block; margin-bottom: 2px; }
  .cat-chip .c-name { font-size: 10px; color: var(--text2); font-weight: 400; }
  .cat-chip.selected { background: var(--green-light); border-color: var(--green-mid); }
  .cat-chip.selected .c-name { color: var(--green); font-weight: 500; }
  .cat-chip.expense.selected { background: var(--red-light); border-color: var(--red-mid); }
  .cat-chip.expense.selected .c-name { color: var(--red); }

  .submit-btn {
    width: 100%; padding: 15px;
    border-radius: var(--radius-sm);
    border: none; cursor: pointer;
    font-size: 15px; font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    color: #fff; margin-top: 20px;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  .submit-btn:active { transform: scale(0.98); opacity: 0.9; }
  .submit-btn.income { background: var(--green); }
  .submit-btn.expense { background: var(--red); }

  /* ── REPORT PAGE ── */
  .report-period {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .report-period::-webkit-scrollbar { display: none; }
  .period-pill {
    padding: 6px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .period-pill.active { background: var(--text); color: #fff; border-color: var(--text); font-weight: 500; }

  .report-hero {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border2);
  }
  .report-hero .rh-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
  .report-hero .rh-amount { font-family: 'DM Serif Display', serif; font-size: 32px; letter-spacing: -0.5px; color: var(--text); margin-bottom: 14px; }
  .report-hero .rh-amount.negative { color: var(--red); }
  .rh-bars { display: flex; gap: 8px; align-items: flex-end; height: 6px; }
  .rh-bar { height: 6px; border-radius: 3px; transition: width 0.5s ease; }
  .rh-bar.income { background: var(--green-mid); }
  .rh-bar.expense { background: var(--red-mid); }

  .report-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .r-stat {
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border2);
  }
  .r-stat .rs-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; }
  .r-stat .rs-val { font-size: 20px; font-weight: 600; }
  .r-stat .rs-val.green { color: var(--green); }
  .r-stat .rs-val.red { color: var(--red); }
  .r-stat .rs-count { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* bar chart */
  .chart-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 16px 14px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border2);
    margin-bottom: 12px;
  }
  .chart-title { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 14px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bars-pair { display: flex; gap: 2px; align-items: flex-end; width: 100%; }
  .bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 3px; transition: height 0.4s ease; }
  .bar.income { background: var(--green-mid); }
  .bar.expense { background: var(--red-mid); }
  .bar-label { font-size: 9px; color: var(--text3); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

  .chart-legend { display: flex; gap: 14px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  .legend-dot.income { background: var(--green-mid); }
  .legend-dot.expense { background: var(--red-mid); }
  .legend-label { font-size: 11px; color: var(--text2); }

  /* category breakdown */
  .cat-breakdown { display: flex; flex-direction: column; gap: 8px; }
  .cat-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
  }
  .cat-row .cr-icon { font-size: 18px; width: 32px; text-align: center; flex-shrink: 0; }
  .cat-row .cr-body { flex: 1; min-width: 0; }
  .cat-row .cr-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .cat-row .cr-bar-wrap { height: 4px; background: var(--surface2); border-radius: 2px; margin-top: 4px; }
  .cat-row .cr-bar { height: 4px; border-radius: 2px; transition: width 0.5s ease; }
  .cat-row .cr-amount { font-size: 13px; font-weight: 600; flex-shrink: 0; }

  /* savings rate */
  .savings-card {
    background: var(--text);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .savings-card .sc-left .sc-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .savings-card .sc-left .sc-val { font-size: 28px; font-weight: 600; color: #fff; font-family: 'DM Serif Display', serif; }
  .savings-card .sc-left .sc-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .ring { width: 60px; height: 60px; position: relative; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; }

  /* ── LEDGER / CASH BOOK ── */
  .ledger-wrap {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    font-family: 'DM Sans', sans-serif;
  }
  .ledger-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 10px;
    background: var(--text);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .ledger-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    color: #fff;
    letter-spacing: -0.2px;
  }
  .ledger-period {
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Column header row */
  .ledger-header {
    display: grid;
    grid-template-columns: 52px 1fr 72px 72px 72px;
    background: var(--surface2);
    border-bottom: 1.5px solid var(--border);
    padding: 0;
  }
  .ledger-header > div {
    padding: 7px 6px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text2);
    text-align: right;
  }
  .ledger-header .lh-date { text-align: left; padding-left: 10px; }
  .ledger-header .lh-desc { text-align: left; padding-left: 4px; }
  .ledger-header .lh-income { color: var(--green); }
  .ledger-header .lh-expense { color: var(--red); }
  .ledger-header .lh-balance { padding-right: 10px; }

  /* Data rows */
  .ledger-row {
    display: grid;
    grid-template-columns: 52px 1fr 72px 72px 72px;
    border-bottom: 1px solid var(--border2);
    background: var(--surface);
    transition: background 0.1s;
  }
  .ledger-row:last-child { border-bottom: none; }
  .ledger-row:nth-child(even) { background: #FAFAF8; }
  .ledger-row:hover { background: var(--green-light); }
  .ledger-row > div {
    padding: 8px 6px;
    font-size: 12px;
    color: var(--text);
    text-align: right;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .lr-date {
    text-align: left !important;
    justify-content: flex-start !important;
    padding-left: 10px !important;
    font-size: 11px !important;
    color: var(--text3) !important;
    flex-direction: column;
    align-items: flex-start !important;
    gap: 1px;
    line-height: 1.2;
  }
  .lr-date .lr-day { font-size: 12px; font-weight: 600; color: var(--text); }
  .lr-date .lr-mon { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
  .lr-desc {
    text-align: left !important;
    justify-content: flex-start !important;
    padding-left: 4px !important;
    flex-direction: column;
    align-items: flex-start !important;
    gap: 1px;
    line-height: 1.3;
  }
  .lr-desc .lr-name { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
  .lr-desc .lr-cat { font-size: 9px; color: var(--text3); }
  .lr-income { color: var(--green) !important; font-weight: 600 !important; font-size: 12px !important; }
  .lr-expense { color: var(--red) !important; font-weight: 600 !important; font-size: 12px !important; }
  .lr-balance { padding-right: 10px !important; font-weight: 500 !important; font-size: 12px !important; }
  .lr-balance.neg { color: var(--red) !important; }
  .lr-balance.pos { color: var(--green) !important; }
  .lr-empty { color: var(--text3) !important; font-weight: 300 !important; }

  /* Footer totals */
  .ledger-footer {
    display: grid;
    grid-template-columns: 52px 1fr 72px 72px 72px;
    background: var(--surface2);
    border-top: 2px solid var(--border);
    padding: 0;
  }
  .ledger-footer > div {
    padding: 9px 6px;
    font-size: 11px;
    font-weight: 700;
    text-align: right;
  }
  .lf-label {
    grid-column: 1 / 3;
    text-align: left !important;
    padding-left: 10px !important;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text2);
    display: flex;
    align-items: center;
  }
  .lf-inc { color: var(--green); padding-right: 6px; border-top: 1px solid var(--green-mid); }
  .lf-exp { color: var(--red); padding-right: 6px; border-top: 1px solid var(--red-mid); }
  .lf-bal { padding-right: 10px; color: var(--text); border-top: 1px solid var(--border); }

  /* Net balance bar */
  .ledger-net {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: var(--text);
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .ledger-net #ledger-net-val {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: -0.3px;
    text-transform: none;
    color: #fff;
  }
  .ledger-net #ledger-net-val.neg { color: var(--red-mid); }
  .ledger-net #ledger-net-val.pos { color: var(--green-mid); }

  .ledger-empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    line-height: 1.6;
  }

  /* toast */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.25s ease;
    z-index: 500;
    white-space: nowrap;
    max-width: 90vw;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="app-header">
    <div class="header-top">
      <span class="app-title">Daybook</span>
      <span class="header-date" id="hdr-date"></span>
    </div>
  </div>

  <!-- HOME PAGE -->
  <div class="page active" id="page-home">
    <div class="balance-hero">
      <div class="label">NET BALANCE</div>
      <div class="amount" id="hero-balance">SAR 0.00</div>
      <div class="hero-row">
        <div class="hero-stat">
          <div class="s-label">Income</div>
          <div class="s-val green" id="hero-income">0.00</div>
        </div>
        <div class="hero-stat">
          <div class="s-label">Expenses</div>
          <div class="s-val red" id="hero-expense">0.00</div>
        </div>
      </div>
    </div>

    <div class="section-header">
      <span class="section-title">Transactions</span>
    </div>
    <div class="filter-row" id="home-filter-row">
      <button class="pill active" onclick="setHomeFilter('all',this)">All</button>
      <button class="pill" onclick="setHomeFilter('income',this)">Income</button>
      <button class="pill" onclick="setHomeFilter('expense',this)">Expense</button>
      <button class="pill" onclick="setHomeFilter('today',this)">Today</button>
      <button class="pill" onclick="setHomeFilter('week',this)">This Week</button>
    </div>
    <div class="entry-list" id="home-list"></div>
  </div>

  <!-- ADD PAGE -->
  <div class="page" id="page-add">
    <div class="type-toggle">
      <button class="type-btn income active" onclick="setAddType('income')">
        <span class="t-icon">💰</span>
        <span class="t-label">Income</span>
      </button>
      <button class="type-btn expense" onclick="setAddType('expense')">
        <span class="t-icon">💸</span>
        <span class="t-label">Expense</span>
      </button>
    </div>

    <div class="form-card">
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="f-desc" placeholder="What is this for?" maxlength="60" />
      </div>
      <div class="form-group">
        <label>Amount</label>
        <div class="amount-wrap">
          <span class="currency">SAR</span>
          <input type="number" id="f-amount" placeholder="0.00" min="0" step="0.01" inputmode="decimal" />
        </div>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="f-date" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <div class="cat-grid" id="cat-grid"></div>
      </div>
    </div>
    <button class="submit-btn income" id="add-submit" onclick="submitEntry()">Add Income</button>
  </div>

  <!-- REPORT PAGE -->
  <div class="page" id="page-report">
    <div class="report-period" id="report-period-row">
      <button class="period-pill active" onclick="setReportPeriod('all',this)">All Time</button>
      <button class="period-pill" onclick="setReportPeriod('thisMonth',this)">This Month</button>
      <button class="period-pill" onclick="setReportPeriod('lastMonth',this)">Last Month</button>
      <button class="period-pill" onclick="setReportPeriod('thisYear',this)">This Year</button>
    </div>

    <!-- CASH BOOK LEDGER -->
    <div class="ledger-wrap">
      <!-- Title -->
      <div class="ledger-title-row">
        <span class="ledger-title">Cash Book</span>
        <span class="ledger-period" id="ledger-period-label">All Time</span>
      </div>

      <!-- Column Headers -->
      <div class="ledger-header">
        <div class="lh-date">Date</div>
        <div class="lh-desc">Particulars</div>
        <div class="lh-income">Income</div>
        <div class="lh-expense">Expense</div>
        <div class="lh-balance">Balance</div>
      </div>

      <!-- Rows -->
      <div id="ledger-body"></div>

      <!-- Totals Footer -->
      <div class="ledger-footer">
        <div class="lf-label">TOTALS</div>
        <div class="lf-inc" id="lf-inc">0.00</div>
        <div class="lf-exp" id="lf-exp">0.00</div>
        <div class="lf-bal" id="lf-bal">0.00</div>
      </div>

      <!-- Net Balance -->
      <div class="ledger-net">
        <span>NET BALANCE</span>
        <span id="ledger-net-val">SAR 0.00</span>
      </div>
    </div>

    <div style="height: 10px;"></div>
  </div>

</div><!-- /#app -->

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="goPage('home')">
    <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H5a1 1 0 01-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg></div>
    Home
  </button>
  <button class="nav-btn" id="nav-add" onclick="goPage('add')">
    <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
    Add
  </button>
  <button class="nav-btn" id="nav-report" onclick="goPage('report')">
    <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></div>
    Report
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {
  income: [
    {id:'salary',name:'Salary',icon:'💼'},
    {id:'freelance',name:'Freelance',icon:'💻'},
    {id:'business',name:'Business',icon:'🏪'},
    {id:'investment',name:'Invest',icon:'📈'},
    {id:'gift',name:'Gift',icon:'🎁'},
    {id:'other',name:'Other',icon:'📌'},
  ],
  expense: [
    {id:'food',name:'Food',icon:'🍽️'},
    {id:'transport',name:'Transport',icon:'🚗'},
    {id:'shopping',name:'Shopping',icon:'🛍️'},
    {id:'bills',name:'Bills',icon:'💡'},
    {id:'health',name:'Health',icon:'💊'},
    {id:'education',name:'Education',icon:'📚'},
    {id:'entertainment',name:'Entertain',icon:'🎬'},
    {id:'rent',name:'Rent',icon:'🏠'},
    {id:'other',name:'Other',icon:'📌'},
  ]
};

let entries = JSON.parse(localStorage.getItem('daybook_entries') || '[]');
let addType = 'income';
let selectedCat = 'salary';
let homeFilter = 'all';
let reportPeriod = 'all';

function save() { localStorage.setItem('daybook_entries', JSON.stringify(entries)); }
function fmt(n) { return n.toLocaleString('en-SA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ── NAV ── */
function goPage(p) {
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  if(p==='home') renderHome();
  if(p==='report') renderReport();
}

/* ── HOME ── */
function setHomeFilter(f, el) {
  homeFilter = f;
  document.querySelectorAll('#home-filter-row .pill').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderHome();
}

function filterEntries(list, f) {
  const now = new Date();
  if(f==='income') return list.filter(e=>e.type==='income');
  if(f==='expense') return list.filter(e=>e.type==='expense');
  if(f==='today') {
    const td = now.toISOString().split('T')[0];
    return list.filter(e=>e.date===td);
  }
  if(f==='week') {
    const mon = new Date(now); mon.setDate(now.getDate()-now.getDay()+1);
    return list.filter(e=>new Date(e.date)>=mon);
  }
  return list;
}

function catIcon(type, catId) {
  const arr = CATS[type]||[];
  const c = arr.find(x=>x.id===catId);
  return c ? c.icon : '📌';
}
function catName(type, catId) {
  const arr = CATS[type]||[];
  const c = arr.find(x=>x.id===catId);
  return c ? c.name : catId;
}

function renderHome() {
  const inc = entries.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
  const exp = entries.filter(e=>e.type==='expense').reduce((s,e)=>s+e.amount,0);
  const bal = inc - exp;
  const balEl = document.getElementById('hero-balance');
  balEl.textContent = 'SAR ' + fmt(Math.abs(bal));
  balEl.className = 'amount' + (bal<0?' negative':'');
  if(bal<0) balEl.textContent = '− SAR ' + fmt(Math.abs(bal));
  document.getElementById('hero-income').textContent = fmt(inc);
  document.getElementById('hero-expense').textContent = fmt(exp);

  const list = filterEntries([...entries].sort((a,b)=>new Date(b.date)-new Date(a.date)), homeFilter);
  const el = document.getElementById('home-list');
  if(!list.length) {
    el.innerHTML = '<div class="empty-state"><div class="e-icon">📋</div>No transactions yet.<br>Tap + to add your first entry.</div>';
    return;
  }
  el.innerHTML = list.map(e=>{
    const d = new Date(e.date+'T00:00:00');
    const ds = d.toLocaleDateString('en-SA',{day:'2-digit',month:'short',year:'numeric'});
    const sign = e.type==='income'?'+':'−';
    return `<div class="entry-card">
      <div class="entry-icon ${e.type}">${catIcon(e.type,e.cat)}</div>
      <div class="entry-body">
        <div class="entry-desc">${e.desc}</div>
        <div class="entry-meta">${catName(e.type,e.cat)} · ${ds}</div>
      </div>
      <div class="entry-right">
        <div class="entry-amount ${e.type}">${sign} ${fmt(e.amount)}</div>
        <button class="del-btn" onclick="deleteEntry(${e.id})">✕</button>
      </div>
    </div>`;
  }).join('');
}

function deleteEntry(id) {
  if(!confirm('Delete this entry?')) return;
  entries = entries.filter(e=>e.id!==id);
  save(); renderHome();
  showToast('Entry deleted');
}

/* ── ADD ── */
function setAddType(t) {
  addType = t;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.type-btn.'+t).classList.add('active');
  const btn = document.getElementById('add-submit');
  btn.textContent = t==='income'?'Add Income':'Add Expense';
  btn.className = 'submit-btn '+t;
  selectedCat = t==='income'?'salary':'food';
  buildCatGrid();
}

function buildCatGrid() {
  const cats = CATS[addType];
  document.getElementById('cat-grid').innerHTML = cats.map(c=>`
    <button class="cat-chip ${addType} ${c.id===selectedCat?'selected':''}" onclick="selCat('${c.id}',this)">
      <span class="c-icon">${c.icon}</span>
      <span class="c-name">${c.name}</span>
    </button>`).join('');
}

function selCat(id, el) {
  selectedCat = id;
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

function submitEntry() {
  const desc = document.getElementById('f-desc').value.trim();
  const amount = parseFloat(document.getElementById('f-amount').value);
  const date = document.getElementById('f-date').value;
  if(!desc||isNaN(amount)||amount<=0||!date) { showToast('Please fill all fields'); return; }
  entries.unshift({id:Date.now(), type:addType, desc, amount, cat:selectedCat, date});
  save();
  document.getElementById('f-desc').value='';
  document.getElementById('f-amount').value='';
  document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
  setAddType('income');
  showToast((addType==='income'?'Income':'Expense')+' added!');
  goPage('home');
}

/* ── REPORT ── */
function setReportPeriod(p, el) {
  reportPeriod = p;
  document.querySelectorAll('.period-pill').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderReport();
}

function getReportEntries() {
  const now = new Date();
  if(reportPeriod==='all') return entries;
  if(reportPeriod==='thisMonth') {
    return entries.filter(e=>{
      const d=new Date(e.date+'T00:00:00');
      return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    });
  }
  if(reportPeriod==='lastMonth') {
    const lm = new Date(now.getFullYear(), now.getMonth()-1, 1);
    return entries.filter(e=>{
      const d=new Date(e.date+'T00:00:00');
      return d.getMonth()===lm.getMonth()&&d.getFullYear()===lm.getFullYear();
    });
  }
  if(reportPeriod==='thisYear') {
    return entries.filter(e=>new Date(e.date+'T00:00:00').getFullYear()===now.getFullYear());
  }
  return entries;
}

function renderReport() {
  const data = getReportEntries().slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  const labels = {all:'All Time',thisMonth:'This Month',lastMonth:'Last Month',thisYear:'This Year'};
  document.getElementById('ledger-period-label').textContent = labels[reportPeriod]||'';

  const bodyEl = document.getElementById('ledger-body');

  if(!data.length) {
    bodyEl.innerHTML = '<div class="ledger-empty">No transactions found for this period.<br>Add some entries to see your cash book.</div>';
    document.getElementById('lf-inc').textContent = '0.00';
    document.getElementById('lf-exp').textContent = '0.00';
    document.getElementById('lf-bal').textContent = '0.00';
    const nv = document.getElementById('ledger-net-val');
    nv.textContent = 'SAR 0.00'; nv.className = '';
    return;
  }

  let runBal = 0, totalInc = 0, totalExp = 0;
  const rows = data.map(e => {
    const d = new Date(e.date+'T00:00:00');
    const day = d.getDate();
    const mon = d.toLocaleString('en-SA',{month:'short'});
    const catInfo = (CATS[e.type]||[]).find(x=>x.id===e.cat)||{name:e.cat,icon:'📌'};
    const isInc = e.type==='income';
    if(isInc) { runBal += e.amount; totalInc += e.amount; }
    else       { runBal -= e.amount; totalExp += e.amount; }
    const balClass = runBal < 0 ? 'neg' : 'pos';
    const incCell  = isInc  ? `<div class="lr-income">${fmt(e.amount)}</div>`  : `<div class="lr-empty">—</div>`;
    const expCell  = !isInc ? `<div class="lr-expense">${fmt(e.amount)}</div>` : `<div class="lr-empty">—</div>`;
    return `<div class="ledger-row">
      <div class="lr-date"><span class="lr-day">${day}</span><span class="lr-mon">${mon}</span></div>
      <div class="lr-desc"><span class="lr-name">${e.desc}</span><span class="lr-cat">${catInfo.icon} ${catInfo.name}</span></div>
      ${incCell}
      ${expCell}
      <div class="lr-balance ${balClass}">${runBal<0?'(':''}${fmt(Math.abs(runBal))}${runBal<0?')':''}</div>
    </div>`;
  });
  bodyEl.innerHTML = rows.join('');

  document.getElementById('lf-inc').textContent = fmt(totalInc);
  document.getElementById('lf-exp').textContent = fmt(totalExp);
  document.getElementById('lf-bal').textContent = (runBal<0?'(':'')+fmt(Math.abs(runBal))+(runBal<0?')':'');
  const nv = document.getElementById('ledger-net-val');
  nv.textContent = (runBal<0?'− ':'')+'SAR '+fmt(Math.abs(runBal));
  nv.className = runBal<0?'neg':runBal>0?'pos':'';
}

/* ── INIT ── */
document.getElementById('hdr-date').textContent = new Date().toLocaleDateString('en-SA',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
document.getElementById('f-date').value = new Date().toISOString().split('T')[0];
buildCatGrid();
renderHome();


</script>
</body>
</html>
